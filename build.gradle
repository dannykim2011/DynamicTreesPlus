import java.time.Instant
import java.time.format.DateTimeFormatter

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven { url = 'https://harleyoconnor.com/maven' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
}

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

sourceSets.main.java {
    // Replaced in 26.1 by the block-state model-part format.
    exclude 'com/dtteam/dynamictreesplus/model/**'
    exclude 'com/dtteam/dynamictreesplus/event/BakedModelEventHandler.java'
    // Their output is committed; 26.1 data generation uses model-part JSON directly.
    exclude 'com/dtteam/dynamictreesplus/data/CapStateGenerator.java'
    exclude 'com/dtteam/dynamictreesplus/data/CapCenterStateGenerator.java'
}

neoForge {
    version = project.neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
        }

        client {
            client()
            gameDirectory = file('run')
        }

        server {
            server()
            gameDirectory = file('run-server')
        }

        data {
            clientData()
            gameDirectory = file('run')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }
}

dependencies {
    implementation "com.dtteam.dynamictrees:dynamictrees-neoforge-${minecraft_version}:${dynamic_trees_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def replaceProperties = [
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_credits             : mod_credits,
            mod_description         : mod_description,
            minecraft_version_range : minecraft_version_range,
            neo_version_range       : neo_version_range,
            dynamic_trees_version   : dynamic_trees_version
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Specification-Title': project.name,
                'Specification-Vendor': 'Dynamic Trees Team',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Dynamic Trees Team',
                'Implementation-Timestamp': DateTimeFormatter.ISO_INSTANT.format(Instant.now())
        )
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/mcmodsrepo" }
    }
}
